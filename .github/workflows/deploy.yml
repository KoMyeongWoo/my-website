name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master   # master 브랜치에 push될 때 자동 배포

  workflow_dispatch:       # 수동 실행도 허용

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true  # 중복 배포 방지

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Static Export)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /my-website   # GitHub Pages 서브경로 주입

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out   # 정적 빌드 결과물 경로

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
